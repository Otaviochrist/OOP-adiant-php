<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="form.css">
  <title>Cadastro da pessoa</title>
</head>
<body>
   <form enctype= "multipart/form-data" method="post" action="pessoa_form.php">

     <label>Código: </label>
     <input name="id" type="text" readonly="1"  value="{id}">

     <label>Nome: </label>
     <input name="nome" type="text" value="{nome}">

     <label>Endereço: </label>
     <input name="endereco" type="text" value="{endereco}">

     <label>Bairro: </label>
     <input name="bairro" type="text" value="{bairro}">

     <label>Telefone: </label>
     <input name="telefone" type="text" value="{telefone}">

     <label>E-mail: </label>
     <input name="email" type="text" value="{email}">

     <label>Cidade: </label>
     <select name="id_cidade">
     {cidades}
     </select>
     <input type="submit" value="Enviar">
   </form>
</body>
</html>
